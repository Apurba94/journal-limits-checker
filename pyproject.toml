[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "journal-limits-checker"
version = "0.1.0"
description = "Validate a manuscript against journal limits for words, references, figures and tables."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
journal-limits-checker = "journal_limits_checker.cli:main"

[tool.setuptools]
packages = ["journal_limits_checker"]
